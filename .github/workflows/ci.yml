name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # The project was created with Xcode 26.3 (see README).
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build and test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project MIRABILIA/MIRABILIA.xcodeproj \
            -scheme MIRABILIA \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
